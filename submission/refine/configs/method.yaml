# LoRIT. The topology is induced from reasoning states each round:
#   S_t -> D_t (ordered-pair refinement) -> C_t (SCC condensation) -> G_t (transitive reduction)
#       -> H_t (agent-level execution graph) -> S_{t+1}
# There are no topology hyperparameters. Everything below is a budget, a role choice, or a paper ablation.
method_name: lorit
random_seed: 2025

num_agents: 5
max_rounds: 2

# Agent role set (default: domain). epistemic = reasoning-route lenses; domain = domain experts, each stating both a
# discipline and the checking behaviour it brings. lenses: null uses the set's default order; an explicit list must name roles in
# the chosen set.
role_mode: domain
lenses: null
temperature: 0.7

# ---- ablations ----
# true: G_t = TransitiveReduction(C_t).  false: G_t = C_t.
transitive_reduction: true
# all_to_all: every member of C_a is exposed to every member of C_b for each G edge C_a -> C_b (LoRIT).
# direct:     only witnessed D edges between G-adjacent components are kept.
cross_component_lifting: all_to_all

# ---- LLM budgets (do not enter graph construction) ----
judge_temperature: 0.0
judge_max_tokens: 512
readout_temperature: 0.0
# Max characters of a reasoning trace printed into another agent's / the judge's prompt (head+tail kept).
max_state_chars: 6000

# Assert the topology invariants (DAG, reachability preservation, H construction) on every round.
check_invariants: true

# Parallel LLM calls inside one item (pair judgments, revisions).
max_workers: 8
max_tokens: 8192
timeout: 900
item_workers: 6
